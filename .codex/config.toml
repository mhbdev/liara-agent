# Optional project defaults for Codex. Merge with existing project settings.
# Start Codex in this repository and trust the project for these to load.
# See docs/en/04-providers.md for CLI launch options and activation checks.
#
# The pack's Claude PreToolUse hook does not run automatically in Codex.
# AGENTS.md requires the wrapper and manual guard checks before mutations.
# A filesystem sandbox does not make a remote hosting account read-only.

approval_policy = "on-request"
sandbox_mode = "read-only"
project_doc_max_bytes = 32768

# Keep the user's configured model. Configuration profiles belong in user
# configuration, not project-local .codex/config.toml, on current Codex.
# For staging work requiring local writes and network access, use the explicit
# CLI options in the provider guide. Production still requires the separate,
# single-use approval granted by a human through scripts/approve.sh.
